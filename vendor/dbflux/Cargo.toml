[workspace]
members = ["crates/dbflux_core", "crates/dbflux_policy", "crates/dbflux_tunnel_core", "crates/dbflux_ssh", "crates/dbflux_driver_postgres", "crates/dbflux_driver_mysql", "crates/dbflux_driver_sqlite"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.9.0-dev.0"
authors = ["Ignacio Perez <ignacio@feuer.me>"]
description = "A fast, keyboard-first database client"
repository = "https://github.com/0xErwin1/dbflux"
homepage = "https://dbflux.dev"
documentation = "https://docs.dbflux.dev/"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dbflux_core = { path = "crates/dbflux_core" }
dbflux_ssh = { path = "crates/dbflux_ssh" }
dbflux_policy = { path = "crates/dbflux_policy" }
mysql = "28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2"
dirs = "6"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.11"
flate2 = "1"
zstd = "0.13"
snap = "1"
lz4_flex = "0.14"
rmp-serde = "1.3"
sqlformat = "0.5.0"

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"

[patch.crates-io]
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
